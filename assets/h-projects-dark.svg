<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 76" width="1200" height="76" role="img" aria-label="Projects"><title>Projects</title><style>@font-face{font-family:'BSD';font-weight:900;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'HG';font-weight:500;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'HG';font-weight:600;src:url(data:font/woff2;base64,) format('woff2')}.t{font:900 40px BSD,Impact,sans-serif;fill:#EEF0F2;letter-spacing:3px;animation:up .6s ease-out both}.n{font:900 24px BSD,Impact,sans-serif;fill:#FF5B14;letter-spacing:2px}.rl{transform-box:fill-box;transform-origin:left;animation:grow 1s cubic-bezier(.2,.8,.2,1) .2s both}.cube{animation:bob 3s ease-in-out infinite}
@keyframes up{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
@keyframes drop{from{transform:translateY(-90px);opacity:0}70%{opacity:1}to{transform:none;opacity:1}}
@keyframes pop{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><g class="cube"><polygon points="36,25 53,34 36,43 19,34" fill="#FF5B14"/><polygon points="19,34 36,43 36,61 19,52" fill="#D94A0C"/><polygon points="53,34 36,43 36,61 53,52" fill="#A83600"/></g><text x="66" y="54" class="t">PROJECTS</text><rect class="rl" x="258" y="38" width="872" height="2" fill="#2B3038"/><text x="1176" y="52" text-anchor="end" class="n">01</text></svg>